name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Минимальная версия из pyproject.toml. Игра ставится в Arch, где
          # Python свежее, но ловить несовместимость надо на нижней границе.
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: Тесты
        # Бенчмарк догона (-m slow) не гоняем на общих раннерах: там мерится
        # соседняя нагрузка, а не наш код. Он для локального прогона.
        run: pytest -q -m "not slow"

      - name: Сборка пакета
        run: |
          python -m pip install build
          python -m build
